<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftARENA — Albo d'Oro</title>
  <link rel="icon" href="/DraftARENAico.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #020810;
      --bg-card: #0b1428;
      --bg-card2:#0e1a32;
      --border:  #1c2d4a;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --dim:     #475569;
      --blue:    #2563eb;
      --sky:     #38bdf8;
      --green:   #10b981;
      --amber:   #f59e0b;
      --gold:    #fbbf24;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* ── NAVBAR ── */
    .nav {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 28px;
      background: rgba(2,8,16,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .nav img { height: 32px; }
    .nav-room {
      background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3);
      border-radius: 6px; padding: 3px 10px;
      font-size: 12px; font-weight: 700; color: var(--sky); letter-spacing: 1.5px;
    }
    .nav-back {
      margin-left: auto; text-decoration: none; color: var(--muted);
      font-size: 13px; font-weight: 600;
      padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-back:hover { color: var(--sky); border-color: var(--sky); }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 64px 24px 48px;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(245,158,11,0.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-trophy { font-size: 3.5rem; margin-bottom: 16px; }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900; letter-spacing: -0.02em; margin-bottom: 8px;
    }
    .hero h1 span { color: var(--gold); }
    .hero p { color: var(--muted); font-size: 0.95rem; max-width: 480px; margin: 0 auto; line-height: 1.6; }

    /* ── WRAPPER ── */
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px 80px; }

    /* ── SECTION LABEL ── */
    .sec-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--sky); margin-bottom: 14px;
    }

    /* ── MEDAGLIERE ── */
    .medagliere-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px; margin-bottom: 48px;
    }
    .med-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 16px; text-align: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .med-card:hover { border-color: rgba(251,191,36,0.4); transform: translateY(-3px); }
    .med-card.gold { border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.06); }
    .med-team { font-size: 0.88rem; font-weight: 700; color: var(--text); margin-bottom: 10px; word-break: break-word; }
    .med-count {
      font-size: 2rem; font-weight: 900; color: var(--gold); letter-spacing: -0.03em;
      margin-bottom: 2px;
    }
    .med-sub { font-size: 11px; color: var(--dim); }
    .med-trophies { font-size: 1.1rem; margin-top: 6px; letter-spacing: 2px; }

    /* ── CLASSIFICA TROFEI ── */
    .trophy-board {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      margin-bottom: 48px;
    }
    .trophy-board-header {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(251,191,36,0.08), rgba(245,158,11,0.03));
    }
    .trophy-board-header .icon { font-size: 1.6rem; }
    .trophy-board-header h2 {
      font-size: 1.1rem; font-weight: 900; letter-spacing: -0.01em;
    }
    .trophy-board-header .sub { font-size: 0.72rem; color: var(--dim); margin-top: 2px; }
    .trophy-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    .trophy-row:last-child { border-bottom: none; }
    .trophy-row:hover { background: rgba(255,255,255,0.02); }
    .trophy-row.top1 { background: rgba(251,191,36,0.06); }
    .trophy-row.top1:hover { background: rgba(251,191,36,0.1); }
    .trophy-rank {
      width: 36px; text-align: center; font-size: 1.3rem; font-weight: 900;
      flex-shrink: 0; color: var(--dim);
    }
    .trophy-row.top1 .trophy-rank { color: var(--gold); }
    .trophy-row.top2 .trophy-rank { color: #d1d5db; }
    .trophy-row.top3 .trophy-rank { color: #cd7f32; }
    .trophy-team {
      flex: 1; min-width: 0;
    }
    .trophy-team-name {
      font-size: 0.95rem; font-weight: 700; color: var(--text);
      word-break: break-word;
    }
    .trophy-row.top1 .trophy-team-name { color: var(--gold); }
    .trophy-team-meta {
      font-size: 0.72rem; color: var(--dim); margin-top: 3px;
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .trophy-chip {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 0.7rem; color: var(--muted);
    }
    .trophy-points {
      flex-shrink: 0; text-align: right;
    }
    .trophy-points-val {
      font-size: 1.4rem; font-weight: 900; color: var(--sky);
      letter-spacing: -0.02em;
    }
    .trophy-points-lbl {
      font-size: 0.62rem; color: var(--dim); text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    @media (max-width: 560px) {
      .trophy-row { padding: 12px 16px; gap: 8px; }
      .trophy-rank { width: 28px; font-size: 1.1rem; }
      .trophy-points-val { font-size: 1.1rem; }
    }

    /* ── STAGIONI ── */
    .season-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .season-card:hover { border-color: rgba(56,189,248,0.25); }
    .season-header {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .season-year {
      font-size: 1.6rem; font-weight: 900; color: var(--gold);
      letter-spacing: -0.03em; line-height: 1;
    }
    .season-label { font-size: 0.88rem; font-weight: 700; color: var(--text); }
    .season-sub   { font-size: 0.75rem; color: var(--dim); margin-top: 2px; }
    .season-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    @media (max-width: 560px) { .season-body { grid-template-columns: 1fr; } }

    .season-col { padding: 18px 22px; }
    .season-col + .season-col { border-left: 1px solid var(--border); }
    @media (max-width: 560px) { .season-col + .season-col { border-left: none; border-top: 1px solid var(--border); } }

    .col-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 12px;
    }

    /* Classifica */
    .rank-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-pos { width: 28px; text-align: center; font-size: 1rem; flex-shrink: 0; }
    .rank-pos.num { font-size: 0.82rem; font-weight: 700; color: var(--dim); }
    .rank-name { font-size: 0.85rem; font-weight: 600; color: var(--text); flex: 1; word-break: break-word; }
    .rank-name.first  { color: var(--gold); }
    .rank-name.second { color: #d1d5db; }
    .rank-name.third  { color: #cd7f32; }

    /* Competizioni */
    .comp-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .comp-row:last-child { border-bottom: none; }
    .comp-emoji { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
    .comp-info { flex: 1; }
    .comp-nome  { font-size: 0.82rem; color: var(--muted); }
    .comp-vince { font-size: 0.88rem; font-weight: 700; color: var(--text); margin-top: 2px; word-break: break-word; }

    /* empty / loading */
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--dim); font-size: 0.9rem; line-height: 1.7;
    }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; }
    .loader { text-align: center; padding: 60px 20px; color: var(--sky); font-size: 0.9rem; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
  </style>
</head>
<body>

<nav class="nav">
  <img src="/DraftARENA.png" alt="DraftARENA">
  <span class="nav-room" id="nav-room">---</span>
  <a href="/#hub" class="nav-back" data-i18n="albo_nav_hub">← Hub</a>
</nav>

<div class="hero">
  <div class="hero-trophy">🏆</div>
  <h1 data-i18n-html="albo_title">Albo d'<span>Oro</span></h1>
  <p data-i18n="albo_desc">Lo storico completo della lega — classifiche, coppe e vittorie stagione dopo stagione.</p>
</div>

<div class="wrap">

  <div id="content">
    <div class="loader"><span class="spin">⏳</span> <span data-i18n="albo_loading">Caricamento in corso...</span></div>
  </div>

</div>

<script src="/i18n.js"></script>
<script>
  I18N.applyLang('albo');
  const params = new URLSearchParams(location.search);
  const roomCode = (params.get('room') || sessionStorage.getItem('roomCode') || '').toUpperCase().trim();

  document.getElementById('nav-room').textContent = roomCode || '---';
  document.title = roomCode ? `Albo d'Oro — ${roomCode}` : "Albo d'Oro — DraftARENA";

  let _trophyConfig = null;
  let _teamAliases = null;

  function resolveTeamName(rawName) {
    if (!rawName) return rawName;
    if (!_teamAliases) return rawName;
    for (const group of _teamAliases) {
      if (group.canonical_name === rawName) return group.canonical_name;
      const aliases = Array.isArray(group.aliases) ? group.aliases : [];
      if (aliases.includes(rawName)) return group.canonical_name;
    }
    return rawName;
  }

  function computeTrophyLeaderboard(seasons) {
    const config = _trophyConfig || [];
    const byName = {};
    config.forEach(c => { byName[c.name] = c; });
    // Campionato is always classifica[0]
    const campionatoCfg = config.find(c => c.id === 'campionato') || { name: 'Campionato', emoji: '🏆', points: 100, priority: 1 };

    const teams = {};
    function ensureTeam(name) {
      const resolved = resolveTeamName(name);
      if (!teams[resolved]) {
        teams[resolved] = { name: resolved, totalPoints: 0, trophies: {} };
      }
      return teams[resolved];
    }
    function addTrophy(name, compName, cfg) {
      const t = ensureTeam(name);
      t.totalPoints += (cfg?.points || 0);
      const key = compName;
      if (!t.trophies[key]) t.trophies[key] = { count: 0, emoji: cfg?.emoji || '🏅', points: cfg?.points || 0, priority: cfg?.priority || 99 };
      t.trophies[key].count++;
    }

    seasons.forEach(s => {
      const cl = s.season_data?.classifica || [];
      if (cl[0]?.nome) {
        addTrophy(cl[0].nome, campionatoCfg.name, campionatoCfg);
      }
      const comps = s.season_data?.competizioni || [];
      comps.forEach(c => {
        if (!c.vincitore) return;
        const cfg = byName[c.nome] || { name: c.nome, emoji: c.emoji || '🏅', points: 0, priority: 99 };
        addTrophy(c.vincitore, c.nome, cfg);
      });
    });

    const arr = Object.values(teams).filter(t => t.totalPoints > 0 || Object.keys(t.trophies).length > 0);
    arr.sort((a, b) => {
      if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
      // Tie-break: compare trophy counts by priority order
      const allKeys = new Set([...Object.keys(a.trophies), ...Object.keys(b.trophies)]);
      const sortedKeys = [...allKeys].sort((k1, k2) =>
        (a.trophies[k1]?.priority || 99) - (a.trophies[k2]?.priority || 99));
      for (const key of sortedKeys) {
        const aCount = a.trophies[key]?.count || 0;
        const bCount = b.trophies[key]?.count || 0;
        if (bCount !== aCount) return bCount - aCount;
      }
      return a.name.localeCompare(b.name);
    });

    return arr;
  }

  function renderTrophyBoard(seasons) {
    const board = computeTrophyLeaderboard(seasons);
    if (board.length === 0) return '';
    const config = _trophyConfig || [];
    const compLegend = config.map(c => `<span class="trophy-chip">${esc(c.emoji)} ${esc(c.name)}: ${c.points}pt</span>`).join('');

    const rows = board.map((t, i) => {
      const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      const medals = ['🥇','🥈','🥉'];
      const rankDisplay = i < 3 ? medals[i] : (i + 1);
      const trophyChips = Object.entries(t.trophies)
        .sort(([,a],[,b]) => (a.priority || 99) - (b.priority || 99))
        .map(([name, info]) => `<span class="trophy-chip">${esc(info.emoji)} ${info.count}× ${esc(name)}</span>`)
        .join('');
      return `<div class="trophy-row ${rankClass}">
        <div class="trophy-rank">${rankDisplay}</div>
        <div class="trophy-team">
          <div class="trophy-team-name">${esc(t.name)}</div>
          <div class="trophy-team-meta">${trophyChips}</div>
        </div>
        <div class="trophy-points">
          <div class="trophy-points-val">${t.totalPoints}</div>
          <div class="trophy-points-lbl">` + I18N.t('albo','albo_points') + `</div>
        </div>
      </div>`;
    }).join('');

    return `<div class="trophy-board">
      <div class="trophy-board-header">
        <div class="icon">🏆</div>
        <div>
          <h2>` + I18N.t('albo','albo_trophy_title') + `</h2>
          <div class="sub">${compLegend}</div>
        </div>
      </div>
      ${rows}
    </div>`;
  }

  async function loadAlbo() {
    const content = document.getElementById('content');
    if (!roomCode) {
      content.innerHTML = `<div class="empty"><div class="icon">🔍</div>` + I18N.t('albo','albo_no_code') + `</div>`;
      return;
    }
    try {
      const [alboRes, cfgRes, aliasRes] = await Promise.all([
        fetch(`/api/lega/${roomCode}/albo`).then(r => r.json()),
        fetch(`/api/lega/${roomCode}/trophy-config`).then(r => r.json()),
        fetch(`/api/lega/${roomCode}/team-aliases`).then(r => r.json())
      ]);
      if (!alboRes.success) throw new Error(alboRes.error);
      if (cfgRes.success) _trophyConfig = cfgRes.config;
      if (aliasRes.success) _teamAliases = aliasRes.aliases;

      const seasons = alboRes.seasons.filter(s => s.season_data &&
        (s.season_data.classifica?.length || s.season_data.competizioni?.length));

      if (seasons.length === 0) {
        content.innerHTML = `<div class="empty">
          <div class="icon">📋</div>
          ` + I18N.t('albo','albo_no_seasons') + `
        </div>`;
        return;
      }

      content.innerHTML = renderTrophyBoard(seasons) + renderMedagliere(seasons) + renderStagioni(seasons);
    } catch(e) {
      content.innerHTML = `<div class="empty"><div class="icon">⚠️</div>${esc(e.message)}</div>`;
    }
  }

  function renderMedagliere(seasons) {
    const counts = {};
    const details = {};
    seasons.forEach(s => {
      const comps = s.season_data.competizioni || [];
      comps.forEach(c => {
        if (!c.vincitore) return;
        counts[c.vincitore] = (counts[c.vincitore] || 0) + 1;
        if (!details[c.vincitore]) details[c.vincitore] = [];
        details[c.vincitore].push(c.emoji || '🏅');
      });
      const cl = s.season_data.classifica || [];
      if (cl[0]?.nome) {
        counts[cl[0].nome] = (counts[cl[0].nome] || 0) + 1;
        if (!details[cl[0].nome]) details[cl[0].nome] = [];
        details[cl[0].nome].push('🥇');
      }
    });
    const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    if (sorted.length === 0) return '';
    const cards = sorted.map(([nome, tot], i) => `
      <div class="med-card ${i===0?'gold':''}">
        <div class="med-team">${esc(nome)}</div>
        <div class="med-count">${tot}</div>
        <div class="med-sub">` + (tot===1 ? I18N.t('albo','albo_titolo_s') : I18N.t('albo','albo_titoli_p')) + `</div>
        <div class="med-trophies">${(details[nome]||[]).join('')}</div>
      </div>`).join('');
    return `<div style="margin-bottom:40px;">
      <div class="sec-label">` + I18N.t('albo','albo_medagliere') + `</div>
      <div class="medagliere-grid">${cards}</div>
    </div>`;
  }

  function renderStagioni(seasons) {
    return `<div class="sec-label">` + I18N.t('albo','albo_stagioni') + `</div>` +
      seasons.map(s => {
        const cl = s.season_data.classifica || [];
        const comps = s.season_data.competizioni || [];
        const medals = ['🥇','🥈','🥉'];
        const classCol = cl.length
          ? cl.map((r, i) => {
              const cls = i===0?'first':i===1?'second':i===2?'third':'';
              const extra = [];
              if (r.presidente) extra.push(`<span style="color:#94a3b8;">${esc(r.presidente)}</span>`);
              if (r.punti != null) extra.push(`<span style="color:#38bdf8;font-weight:700;">${esc(r.punti)} ${I18N.lang()==='en'?'pts':'pt'}</span>`);
              if (r.trofeo) extra.push(`<span style="color:#fbbf24;">${esc(r.trofeo)}</span>`);
              if (r.altro) extra.push(`<span style="color:#64748b;font-style:italic;">${esc(r.altro)}</span>`);
              const extraHtml = extra.length ? `<div style="font-size:0.72rem;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;">${extra.join('')}</div>` : '';
              return `<div class="rank-row" style="flex-direction:column;align-items:flex-start;gap:2px;">
                <div style="display:flex;align-items:center;gap:10px;width:100%;">
                  <div class="rank-pos">${medals[i] || `<span class="rank-pos num">${i+1}</span>`}</div>
                  <div class="rank-name ${cls}">${esc(r.nome)}</div>
                </div>
                ${extraHtml}
              </div>`;
            }).join('')
          : '<p style="font-size:0.83rem;color:#475569;">' + I18N.t('albo','albo_no_classifica') + '</p>';

        const compCol = comps.length
          ? comps.map(c => `<div class="comp-row">
              <div class="comp-emoji">${c.emoji||'🏅'}</div>
              <div class="comp-info">
                <div class="comp-nome">${esc(c.nome)}</div>
                <div class="comp-vince">${esc(c.vincitore||'—')}</div>
              </div>
            </div>`).join('')
          : '<p style="font-size:0.83rem;color:#475569;">' + I18N.t('albo','albo_no_competizioni') + '</p>';

        const d = new Date(s.exported_at);
        const dateStr = d.toLocaleDateString(I18N.lang()==='en'?'en-GB':'it-IT', { year:'numeric', month:'long', day:'numeric' });

        return `<div class="season-card">
          <div class="season-header">
            <div class="season-year">${s.year}</div>
            <div>
              <div class="season-label">${esc(s.label)}</div>
              <div class="season-sub">` + I18N.t('albo','albo_archiviata') + ` ${dateStr}</div>
            </div>
          </div>
          <div class="season-body">
            <div class="season-col">
              <div class="col-title">` + I18N.t('albo','albo_classifica') + `</div>
              ${classCol}
            </div>
            <div class="season-col">
              <div class="col-title">` + I18N.t('albo','albo_competizioni') + `</div>
              ${compCol}
            </div>
          </div>
        </div>`;
      }).join('');
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  loadAlbo();
</script>
</body>
</html>
