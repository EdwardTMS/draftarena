<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftARENA — Rose Live</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DraftArena">
  <link rel="apple-touch-icon" href="/DraftARENAico.png">
  <style>
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1f293d;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    h1 { margin: 0; color: #38bdf8; font-size: 28px; text-transform: uppercase; }
    .btn-back {
      background-color: #1e293b;
      color: #fff;
      padding: 10px 20px;
      border: 1px solid #334155;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-back:hover { background-color: #334155; }
    
    .grid-squadre {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(350px, 100%), 1fr));
      gap: 25px;
    }
    .squadra-card {
      background: #141b2d;
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .squadra-card h3 {
      margin-top: 0;
      color: #f43f5e;
      font-size: 22px;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th {
      text-align: left;
      color: #94a3b8;
      font-size: 13px;
      text-transform: uppercase;
      padding-bottom: 8px;
    }
    td {
      padding: 10px 0;
      border-bottom: 1px solid #1e293d;
      font-size: 15px;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
    }
    /* Colore dei ruoli per il calcio italiano, personalizzali se necessario */
    .P { background-color: #eab308; color: #000; }
    .D { background-color: #2563eb; color: #fff; }
    .C { background-color: #16a34a; color: #fff; }
    .A { background-color: #dc2626; color: #fff; }
    
    .btn-elimina {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      padding: 5px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-elimina:hover { background: rgba(239, 68, 68, 0.1); }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #dc2626; color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-size: 14px; display: none; z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }

    @media (max-width: 768px) {
      body { padding: 16px; }
      header { flex-wrap: wrap; gap: 10px; padding-bottom: 14px; margin-bottom: 20px; }
      h1 { font-size: 20px; }
      .grid-squadre { grid-template-columns: 1fr; gap: 16px; }
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      header { flex-direction: column; align-items: flex-start; gap: 8px; }
      h1 { font-size: 18px; }
      .squadra-card { padding: 14px; }
      .squadra-card h3 { font-size: 18px; }
      th { font-size: 11px; }
      td { font-size: 13px; padding: 8px 0; }
      .btn-back { padding: 7px 12px; font-size: 13px; }
      .btn-elimina { font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- ROOM GATE ──────────────────────────────────────────────────────────── -->
  <div id="room-gate" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0f19;z-index:9999;display:flex;align-items:center;justify-content:center;">
    <div style="background:#141b2d;border:1px solid #1f293d;border-radius:14px;padding:32px;width:340px;max-width:90%;">
      <h2 style="color:#38bdf8;margin:0 0 4px 0;">DraftARENA</h2>
      <p style="color:#64748b;font-size:12px;margin:0 0 20px 0;" data-i18n="rose_gate_subtitle">Pannello Rose — inserisci il codice stanza</p>
      <div style="display:flex;gap:8px;">
        <input id="gate-code-input" type="text" maxlength="6" placeholder="Codice (es: ABC123)" data-i18n-placeholder="rose_gate_ph"
          style="flex:1;padding:12px;border-radius:8px;border:1px solid #1f293d;background:#0b0f19;color:#fff;font-size:16px;text-transform:uppercase;letter-spacing:3px;font-weight:bold;">
        <button id="gate-btn-join" style="padding:10px 16px;border-radius:8px;border:none;background:#10b981;color:#fff;font-weight:bold;font-size:14px;cursor:pointer;" data-i18n="rose_gate_btn">ENTRA</button>
      </div>
      <div id="gate-error" style="color:#ef4444;font-size:12px;margin-top:8px;min-height:16px;"></div>
      <div id="gate-loading" style="color:#38bdf8;font-size:12px;margin-top:6px;display:none;" data-i18n="rose_gate_loading">Connessione...</div>
      <a href="/#hub" style="display:block;margin-top:14px;color:#475569;text-align:center;font-size:12px;text-decoration:none;" data-i18n="rose_nav_hub">← Torna all'Hub</a>
    </div>
  </div>

  <header>
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="/DraftARENAws.png" alt="DraftARENA" style="height:34px;">
      <span style="color:#38bdf8;font-size:16px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;" data-i18n="rose_title">Rose Live</span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button onclick="apriStorico()"
        style="background:linear-gradient(135deg,#6366f1,#4f46e5);border:none;color:#fff;
               padding:10px 16px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;
               transition:all 0.2s;" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
        📚 Storico Aste
      </button>
      <a href="/#hub" class="btn-back" data-i18n="rose_nav_hub">⬅️ Hub</a>
      <a href="/admin" class="btn-back">⬅️ Torna alla Regia</a>
      <a id="btn-back-buzzer" href="#" class="btn-back" style="display:none;background:#10b981;color:#fff;border-color:#10b981;">🔔 Torna al Buzzer</a>
      <button id="lang-toggle" onclick="I18N.toggle('rose')" style="background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);border-radius:6px;padding:10px 12px;font-size:13px;color:#38bdf8;font-weight:bold;cursor:pointer;">🇬🇧 EN</button>
    </div>
  </header>

  <div class="grid-squadre" id="tabellone-rose"></div>
  <div id="toast"></div>

  <!-- PIN Modal per eliminazione giocatori -->
  <div id="pin-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);
       z-index:10000;align-items:center;justify-content:center;">
    <div style="background:#141b2d;border:1px solid #f59e0b;border-radius:14px;
                padding:32px;width:320px;max-width:90%;text-align:center;">
      <div style="font-size:2rem;margin-bottom:8px;">🔒</div>
      <h3 style="color:#f59e0b;margin:0 0 4px 0;" data-i18n="rose_pin_title">PIN Admin richiesto</h3>
      <p style="color:#94a3b8;font-size:12px;margin:0 0 16px 0;" data-i18n="rose_pin_desc">
        Per eliminare un giocatore dalla rosa devi inserire il PIN admin.
      </p>
      <input id="pin-modal-input" type="password" inputmode="numeric" maxlength="10"
        placeholder="PIN admin"
        style="width:100%;box-sizing:border-box;padding:12px;font-size:1.3rem;text-align:center;
               letter-spacing:0.3em;background:#0b0f19;border:1px solid #334155;
               border-radius:8px;color:#fff;margin-bottom:8px;"
        onkeydown="if(event.key==='Enter') _submitPin()">
      <div id="pin-modal-error" style="color:#ef4444;font-size:12px;min-height:18px;margin-bottom:8px;"></div>
      <div style="display:flex;gap:8px;">
        <button onclick="_submitPin()"
          style="flex:1;padding:12px;background:#f59e0b;color:#000;font-weight:bold;
                 border:none;border-radius:8px;cursor:pointer;font-size:1rem;" data-i18n="rose_pin_btn">ENTRA</button>
        <button onclick="_chiudiPinModal()"
          style="padding:12px 16px;background:transparent;color:#94a3b8;
                 border:1px solid #334155;border-radius:8px;cursor:pointer;">✕</button>
      </div>
    </div>
  </div>

  <!-- STORICO ASTE MODAL ──────────────────────────────────────────────────── -->
  <div id="storico-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);
       z-index:10001;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;">
    <div style="background:#141b2d;border:1px solid #334155;border-radius:14px;
                width:100%;max-width:1100px;padding:28px;position:relative;margin:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 style="margin:0;color:#6366f1;font-size:1.4rem;">📚 Storico Aste</h2>
        <button onclick="chiudiStorico()"
          style="background:transparent;border:1px solid #334155;color:#94a3b8;
                 padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.9rem;">✕ Chiudi</button>
      </div>

      <!-- Selezione anno/backup -->
      <div id="storico-lista" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;"></div>

      <!-- Carica da file locale (alternativa al server) -->
      <div style="background:rgba(99,102,241,0.07);border:1px dashed rgba(99,102,241,0.3);
                  border-radius:8px;padding:12px;margin-bottom:20px;">
        <span style="color:#94a3b8;font-size:0.83rem;">
          Oppure carica un file backup salvato sul tuo PC:
        </span>
        <label style="margin-left:10px;cursor:pointer;">
          <input type="file" id="storico-file-input" accept=".json" style="display:none;"
                 onchange="caricaStoricoLocale(this)">
          <span style="background:#4f46e5;color:#fff;padding:5px 14px;border-radius:6px;
                       font-size:0.82rem;font-weight:bold;">📂 Apri file .json</span>
        </label>
      </div>

      <!-- Contenuto storico -->
      <div id="storico-contenuto"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script>
    const socket = io({ transports: ["polling"] });
    I18N.applyLang('rose');
    let toastTimer = null;
    let currentRoomCode = null;
    let pendingSocketRoomCode = null;
    let _isAdminAuthed = false;
    let _pendingDeletion = null; // { team, player, prezzoMax }

    socket.on('connect', () => {
      if (pendingSocketRoomCode) {
        socket.emit('joinRoom', pendingSocketRoomCode);
        pendingSocketRoomCode = null;
      }
    });

    socket.on('adminAuthResult', (data) => {
      if (data.success) {
        _isAdminAuthed = true;
        document.getElementById('pin-modal').style.display = 'none';
        document.getElementById('pin-modal-input').value = '';
        // Esegui l'eliminazione in sospeso
        if (_pendingDeletion) {
          _eseguiRimozione(_pendingDeletion.team, _pendingDeletion.player, _pendingDeletion.prezzoMax);
          _pendingDeletion = null;
        }
      } else {
        _isAdminAuthed = false;
        document.getElementById('pin-modal-error').textContent = I18N.t('rose','rose_pin_err');
      }
    });

    function _submitPin() {
      const pin = document.getElementById('pin-modal-input').value.trim();
      if (!pin) return;
      document.getElementById('pin-modal-error').textContent = '';
      socket.emit('adminAuth', { pin });
    }

    function _chiudiPinModal() {
      document.getElementById('pin-modal').style.display = 'none';
      document.getElementById('pin-modal-input').value = '';
      document.getElementById('pin-modal-error').textContent = '';
      _pendingDeletion = null;
    }

    // ── Room Gate ──────────────────────────────────────────────────────────
    function hideGate() { document.getElementById('room-gate').style.display = 'none'; }
    function gateSetError(msg) { document.getElementById('gate-error').textContent = msg; }
    function gateSetLoading(show) { document.getElementById('gate-loading').style.display = show ? 'block' : 'none'; }

    function onRoomJoined(code) {
      currentRoomCode = code;
      hideGate();
      const btnBuzzer = document.getElementById('btn-back-buzzer');
      if (btnBuzzer) {
        btnBuzzer.href = '/phone.html?room=' + code;
        btnBuzzer.style.display = 'inline-block';
      }
      if (socket.connected) {
        socket.emit('joinRoom', code);
      } else {
        pendingSocketRoomCode = code;
      }
    }

    async function fetchWithTimeout(url, ms) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(url, { signal: ctrl.signal });
        return r.json();
      } finally { clearTimeout(t); }
    }

    (async () => {
      const saved = sessionStorage.getItem('roomCode') || new URLSearchParams(location.search).get('room');
      if (saved) {
        gateSetLoading(true);
        try {
          const res = await fetchWithTimeout('/api/room/join/' + saved, 8000);
          if (res.success) { sessionStorage.setItem('roomCode', res.roomCode); onRoomJoined(res.roomCode); }
          else { sessionStorage.removeItem('roomCode'); gateSetError(res.error || I18N.t('rose','rose_gate_err_notfound')); }
        } catch(e) { gateSetError(I18N.t('rose','rose_gate_err_server')); }
        finally { gateSetLoading(false); }
      }
    })();

    document.getElementById('gate-btn-join').addEventListener('click', gateJoin);
    document.getElementById('gate-code-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') gateJoin(); });

    async function gateJoin() {
      const code = document.getElementById('gate-code-input').value.trim().toUpperCase();
      if (!code) return;
      gateSetLoading(true); gateSetError('');
      try {
        const res = await fetchWithTimeout('/api/room/join/' + code, 8000);
        if (res.success) { sessionStorage.setItem('roomCode', res.roomCode); onRoomJoined(res.roomCode); }
        else gateSetError(res.error || I18N.t('rose','rose_gate_err_notfound'));
      } catch(e) { gateSetError(I18N.t('rose','rose_gate_err_server')); }
      finally { gateSetLoading(false); }
    }

    // ── Game logic ─────────────────────────────────────────────────────────
    function mostraToast(msg, colore) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.background = colore || "#dc2626";
      t.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = "none"; }, 3500);
    }

    // Mappa i ruoli Mantra alle 4 classi CSS colore
    function badgeClass(ruolo) {
      const r = (ruolo || "").toUpperCase();
      if (r === "P") return "P";
      if (r === "DC" || r === "DD" || r === "DS" || r === "B") return "D";
      if (r === "A" || r === "PC" || r === "W" || r === "T") return "A";
      return "C"; // C, M, E e altri centrocampisti
    }

    // Delegazione eventi sul container: evita il problema dei nomi con apostrofo
    // nei onclick inline (es: "D'Ambrosio" rompeva la sintassi JS)
    const container = document.getElementById("tabellone-rose");
    container.addEventListener("click", e => {
      const btn = e.target.closest(".btn-elimina");
      if (!btn) return;
      rimuoviGiocatore(btn.dataset.team, btn.dataset.player, parseInt(btn.dataset.price));
    });

    socket.on("connect", () => { /* getData is fetched after joinRoom via server push */ });

    function aggiorna() { socket.emit("getSoldPlayers"); }
    socket.on("updateTeams", aggiorna);
    socket.on("teamsUpdate", aggiorna);

    socket.on("updateSold", function(soldList) {
      container.innerHTML = "";

      if (soldList.length === 0) {
        container.innerHTML = '<p style="color:#64748b; font-style:italic;">' + I18N.t('rose','rose_no_players') + '</p>';
        return;
      }

      const rosePerSquadra = {};
      soldList.forEach(p => {
        if (!rosePerSquadra[p.winner]) rosePerSquadra[p.winner] = [];
        rosePerSquadra[p.winner].push(p);
      });

      Object.keys(rosePerSquadra).forEach(teamName => {
        const card = document.createElement("div");
        card.className = "squadra-card";

        let html = `
          <h3>⚽ ${teamName}</h3>
          <table>
            <thead>
              <tr>
                <th>${I18N.t('rose','rose_th_player')}</th>
                <th>${I18N.t('rose','rose_th_role')}</th>
                <th>${I18N.t('rose','rose_th_price')}</th>
                <th style="text-align:right;">${I18N.t('rose','rose_th_action')}</th>
              </tr>
            </thead>
            <tbody>
        `;

        rosePerSquadra[teamName].forEach(p => {
          const cls = badgeClass(p.ruolo);
          // Usiamo data-* invece di onclick inline per gestire correttamente
          // nomi con apostrofo (es: "D'Ambrosio") e caratteri speciali
          html += `
            <tr>
              <td><strong>${p.player}</strong><br><small style="color:#64748b">${p.squadra || ""}</small></td>
              <td><span class="badge ${cls}">${p.ruolo}</span></td>
              <td><span style="color:#10b981; font-weight:bold;">${p.price} cr</span></td>
              <td style="text-align:right;">
                <button class="btn-elimina"
                  data-team="${teamName.replace(/"/g, '&quot;')}"
                  data-player="${p.player.replace(/"/g, '&quot;')}"
                  data-price="${p.price}">
                  🗑️ Elimina
                </button>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        card.innerHTML = html;
        container.appendChild(card);
      });
    });

    function rimuoviGiocatore(team, player, prezzoMax) {
      if (!_isAdminAuthed) {
        _pendingDeletion = { team, player, prezzoMax };
        document.getElementById('pin-modal-error').textContent = '';
        document.getElementById('pin-modal-input').value = '';
        document.getElementById('pin-modal').style.display = 'flex';
        setTimeout(() => document.getElementById('pin-modal-input').focus(), 50);
        return;
      }
      _eseguiRimozione(team, player, prezzoMax);
    }

    function _eseguiRimozione(team, player, prezzoMax) {
      let risposta = prompt(
        `⚠️ Stai eliminando "${player.toUpperCase()}" dalla squadra "${team}".\n\n` +
        `Spesa originale: ${prezzoMax} cr.\n` +
        `Quanti crediti vuoi restituire?`,
        prezzoMax
      );
      if (risposta === null) return;

      let crediti = parseInt(risposta.trim());
      if (isNaN(crediti) || crediti < 0) {
        mostraToast("Inserisci un numero intero >= 0.");
        return;
      }
      if (crediti > prezzoMax) {
        if (!confirm(`Stai rimborsando ${crediti} cr, più dei ${prezzoMax} cr spesi. Procedere?`)) return;
      }

      socket.emit("adminRemovePlayer", { teamName: team, playerName: player, creditsToReturn: crediti });
    }

    socket.on("errorNotify", msg => { mostraToast(msg); });

    // ── STORICO ASTE ──────────────────────────────────────────────────────────

    async function apriStorico() {
      document.getElementById('storico-modal').style.display = 'flex';
      document.getElementById('storico-contenuto').innerHTML =
        '<p style="color:#64748b;text-align:center;padding:20px;">' + I18N.t('rose','rose_loading') + '</p>';

      if (!currentRoomCode) {
        document.getElementById('storico-lista').innerHTML =
          '<p style="color:#64748b;font-size:0.85rem;">' + I18N.t('rose','rose_no_backup_hint') + '</p>';
        document.getElementById('storico-contenuto').innerHTML = '';
        return;
      }

      try {
        const res = await fetch('/api/room/' + currentRoomCode + '/backups');
        const data = await res.json();
        const lista = document.getElementById('storico-lista');

        if (!data.success || !data.backups.length) {
          lista.innerHTML = '<p style="color:#64748b;font-size:0.85rem;">' + I18N.t('rose','rose_no_backup') + '</p>';
          document.getElementById('storico-contenuto').innerHTML = '';
          return;
        }

        lista.innerHTML = data.backups.map(b => `
          <button onclick="caricaBackupServer('${b.id}')"
            style="background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.4);
                   color:#a5b4fc;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:0.85rem;
                   font-weight:600;transition:all 0.2s;"
            onmouseover="this.style.background='rgba(99,102,241,0.3)'"
            onmouseout="this.style.background='rgba(99,102,241,0.15)'">
            ${b.label} (${b.year})
          </button>
        `).join('');
        document.getElementById('storico-contenuto').innerHTML = '';
      } catch(e) {
        document.getElementById('storico-lista').innerHTML =
          '<p style="color:#ef4444;font-size:0.85rem;">' + I18N.t('rose','rose_err_backup') + e.message + '</p>';
        document.getElementById('storico-contenuto').innerHTML = '';
      }
    }

    async function caricaBackupServer(id) {
      document.getElementById('storico-contenuto').innerHTML =
        '<p style="color:#64748b;text-align:center;padding:20px;">' + I18N.t('rose','rose_loading') + '</p>';
      try {
        const res = await fetch('/api/room/' + currentRoomCode + '/backups/' + id);
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        renderStoricoBackup(data.backup.backup_data);
      } catch(e) {
        document.getElementById('storico-contenuto').innerHTML =
          '<p style="color:#ef4444;">' + I18N.t('rose','rose_err_generic') + e.message + '</p>';
      }
    }

    function caricaStoricoLocale(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const b = JSON.parse(e.target.result);
          if (!b.version || b.app !== 'DraftARENA') {
            alert('File non valido: non è un backup DraftARENA.');
            return;
          }
          renderStoricoBackup(b);
        } catch { alert('Errore lettura file JSON.'); }
      };
      reader.readAsText(file);
      input.value = '';
    }

    function chiudiStorico() {
      document.getElementById('storico-modal').style.display = 'none';
    }

    function renderStoricoBackup(b) {
      const contenuto = document.getElementById('storico-contenuto');
      if (!b.soldPlayers || !b.teams) {
        contenuto.innerHTML = '<p style="color:#64748b;">' + I18N.t('rose','rose_no_data') + '</p>';
        return;
      }

      // Raggruppa i giocatori venduti per squadra vincitrice
      const rosePerSquadra = {};
      b.soldPlayers.forEach(p => {
        if (!rosePerSquadra[p.winner]) rosePerSquadra[p.winner] = [];
        rosePerSquadra[p.winner].push(p);
      });

      // Crea una mappa budget finale dalle teams del backup
      const budgetFinale = {};
      b.teams.forEach(t => { budgetFinale[t.name] = t.finalBudget; });

      const totalSpent = b.soldPlayers.reduce((s, p) => s + (p.price || 0), 0);
      const totalPlayers = b.soldPlayers.length;

      let html = `
        <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);
                    border-radius:10px;padding:16px;margin-bottom:20px;">
          <div style="color:#a5b4fc;font-weight:700;font-size:1.1rem;margin-bottom:6px;">
            ${b.label || b.auctionName} — ${b.year}
          </div>
          <div style="font-size:0.83rem;color:#64748b;">
            Esportato il ${b.exportedAt ? new Date(b.exportedAt).toLocaleString('it-IT') : '—'} &nbsp;·&nbsp;
            ${Object.keys(rosePerSquadra).length} squadre &nbsp;·&nbsp;
            ${totalPlayers} giocatori acquistati &nbsp;·&nbsp;
            ${totalSpent} cr totali spesi
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:20px;">
      `;

      Object.keys(rosePerSquadra).sort().forEach(teamName => {
        const players = rosePerSquadra[teamName].sort((a, b) => {
          const order = {P:0,D:1,C:2,A:3};
          const ca = badgeClass(a.ruolo), cb = badgeClass(b.ruolo);
          return (order[ca] ?? 4) - (order[cb] ?? 4) || a.player.localeCompare(b.player);
        });
        const totSpeso = players.reduce((s, p) => s + (p.price || 0), 0);
        const budgetRim = budgetFinale[teamName] ?? '—';

        html += `
          <div style="background:#0f172a;border:1px solid #1f293d;border-radius:10px;padding:16px;">
            <div style="color:#f43f5e;font-size:1rem;font-weight:700;
                        border-bottom:1px solid #1f293d;padding-bottom:8px;margin-bottom:10px;">
              ⚽ ${teamName}
            </div>
            <div style="font-size:0.78rem;color:#64748b;margin-bottom:10px;">
              Speso: <strong style="color:#10b981;">${totSpeso} cr</strong> &nbsp;|&nbsp;
              Rimasti: <strong style="color:#f59e0b;">${budgetRim} cr</strong>
            </div>
            <table style="width:100%;border-collapse:collapse;">
              <thead>
                <tr>
                  <th style="text-align:left;color:#475569;font-size:11px;padding-bottom:6px;text-transform:uppercase;">' + I18N.t('rose','rose_th_player') + '</th>
                  <th style="color:#475569;font-size:11px;padding-bottom:6px;text-transform:uppercase;text-align:center;">' + I18N.t('rose','rose_th_role') + '</th>
                  <th style="color:#475569;font-size:11px;padding-bottom:6px;text-transform:uppercase;text-align:right;">' + I18N.t('rose','rose_th_price') + '</th>
                </tr>
              </thead>
              <tbody>
                ${players.map(p => `
                  <tr>
                    <td style="padding:7px 0;border-bottom:1px solid #1e293d;font-size:13px;">
                      <strong>${p.player}</strong>
                      <br><small style="color:#475569;">${p.squadra || ''}</small>
                    </td>
                    <td style="padding:7px 0;border-bottom:1px solid #1e293d;text-align:center;">
                      <span class="badge ${badgeClass(p.ruolo)}">${p.ruolo}</span>
                    </td>
                    <td style="padding:7px 0;border-bottom:1px solid #1e293d;
                               text-align:right;color:#10b981;font-weight:700;font-size:13px;">
                      ${p.price} cr
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      });

      html += '</div>';
      contenuto.innerHTML = html;
    }
  </script>
</body>
</html>
